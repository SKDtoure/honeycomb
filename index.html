<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beeman – animated</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;overflow:hidden;visibility:hidden}
  .layer{position:absolute;inset:0;will-change:transform}
  .layer>.inner{position:absolute;inset:0;will-change:transform}
  .layer img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .layer img.off{visibility:hidden}
  #ui{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;pointer-events:none}
  #ui button{pointer-events:auto;font:13px system-ui,sans-serif;padding:8px 14px;border-radius:999px;border:0;background:rgba(255,255,255,.85);color:#222}
  #ui button[hidden]{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="ui">
  <button id="tiltBtn" hidden>Enable tilt</button>
  <button id="calBtn" hidden>Set neutral</button>
</div>

<script>
/* ============ CONFIG – keep this HTML in the same folder as the PNGs ============ */
const CFG = {
  // wind
  gustSpeed: 0.18,              // slow shared "breeze" cycle (Hz)
  flowers: {
    back:  { prefix:'layer3-beeman-back-flower', count:4, sway:0.7, speed:0.42, parallax:0.4 },
    mid:   { prefix:'layer4-beeman-mid-flower',  count:4, sway:1.2, speed:0.50, parallax:1.0 },
    front: { prefix:'layer5-beeman-frnt-flower', count:4, sway:1.9, speed:0.58, parallax:1.8 },
  },
  // origin of the sway rotation (flowers are assumed to grow from the bottom)
  swayOrigin: '50% 100%',
  // eyes
  eyes: ['layer6-beeman-eye01.png','layer6-beeman-eye02.png','layer6-beeman-eye03.png'], // open, half, closed
  eyeParallax: 0.5,
  halfAt: 8,                    // tilt degrees where eyes go half-closed
  closedAt: 18,                 // tilt degrees where eyes are fully closed
  // bees: frames ping-pong 0,1,2,1 at the given wing-beat rate (Hz)
  bees: [
    { id:'A', prefix:'layer7-beeman-beeA', hz:15, parallax:1.4, tappable:true },
    { id:'B', prefix:'layer8-beeman-beeB', hz:11, parallax:1.2 },
    { id:'C', prefix:'layer9-beeman-beeC', hz:19, parallax:1.0 },
  ],
  parallaxMaxPct: 1.2,          // max shift (% of stage width) at parallax=1 when fully tilted
};
/* ================================================================================ */

const $ = (s)=>document.querySelector(s);
const stage = $('#stage');
const pad = (n)=>String(n).padStart(2,'0');
const loadImg = (src)=>new Promise((res)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>{console.warn('missing',src); res(null)}; i.src=src; i.draggable=false; });

const layers = [];   // {el, inner, parallax}
function makeLayer(parallax){
  const el=document.createElement('div'); el.className='layer';
  const inner=document.createElement('div'); inner.className='inner';
  el.appendChild(inner); stage.appendChild(el);
  const L={el,inner,parallax}; layers.push(L); return L;
}

const flowerItems=[]; const beeItems=[]; let eyeImgs=[]; let eyeLayer;

async function build(){
  const bg = await loadImg('layer1-beeman-background.png');
  if(!bg){ document.body.insertAdjacentHTML('beforeend','<p style="color:#fff;font:14px system-ui;position:fixed;top:12px;left:12px">Put this HTML in the same folder as the layer PNGs.</p>'); return; }
  const NW=bg.naturalWidth, NH=bg.naturalHeight;
  stage.dataset.nw=NW; stage.dataset.nh=NH;

  // 1 background + 2 honeycomb (static)
  { const L=makeLayer(0); L.inner.appendChild(bg); }
  { const hc=await loadImg('layer2-beeman-honeycomb.png'); const L=makeLayer(0.15); if(hc) L.inner.appendChild(hc); }

  // 3-5 flowers: each file is its own layer that sways independently, with phase offsets
  let k=0;
  for(const key of ['back','mid','front']){
    const f=CFG.flowers[key];
    for(let i=1;i<=f.count;i++){
      const img=await loadImg(`${f.prefix}${pad(i)}.png`); if(!img) continue;
      const L=makeLayer(f.parallax); L.inner.appendChild(img);
      L.inner.style.transformOrigin=CFG.swayOrigin;
      flowerItems.push({L, sway:f.sway, speed:f.speed*(0.85+0.3*((i*37)%10)/10), phase:(k++)*1.7+i});
    }
  }

  // 6 eyes
  eyeLayer=makeLayer(CFG.eyeParallax);
  for(const src of CFG.eyes){ const img=await loadImg(src); if(!img) continue; eyeLayer.inner.appendChild(img); eyeImgs.push(img); }
  eyeImgs.forEach((im,i)=>im.classList.toggle('off',i!==0));

  // 7-9 bees
  for(const b of CFG.bees){
    const frames=[];
    const L=makeLayer(b.parallax);
    for(let i=1;i<=3;i++){ const img=await loadImg(`${b.prefix}${pad(i)}.png`); if(img){ L.inner.appendChild(img); frames.push(img);} }
    frames.forEach((im,i)=>im.classList.toggle('off',i!==0));
    const item={...b, L, frames, cur:0, react:0, reactStart:0, center:'50% 50%', hitCanvas:null};
    if(b.tappable) prepareHit(item,NW,NH);
    beeItems.push(item);
  }

  fit(); stage.style.visibility='visible';
  requestAnimationFrame(tick);
}

/* alpha hit-test + bbox of tappable bee (falls back to "tap anywhere" if canvas is tainted on file://) */
function prepareHit(item,NW,NH){
  try{
    const c=document.createElement('canvas'); c.width=NW; c.height=NH;
    const x=c.getContext('2d',{willReadFrequently:true});
    item.frames.forEach(f=>x.drawImage(f,0,0));
    const d=x.getImageData(0,0,NW,NH).data;
    let x0=NW,y0=NH,x1=0,y1=0;
    for(let y=0;y<NH;y+=4)for(let xx=0;xx<NW;xx+=4){ if(d[(y*NW+xx)*4+3]>20){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(y<y0)y0=y; if(y>y1)y1=y; } }
    if(x1>x0){ item.center=`${((x0+x1)/2/NW*100).toFixed(1)}% ${((y0+y1)/2/NH*100).toFixed(1)}%`; }
    item.hitCanvas={x,NW,NH};
  }catch(e){ item.hitCanvas=null; console.info('Hit-test unavailable (serve over http for per-pixel taps); any tap will trigger bee A.'); }
}
function hitsBee(item,clientX,clientY){
  if(!item.hitCanvas) return true;
  const r=stage.getBoundingClientRect();
  const nx=(clientX-r.left)/r.width*item.hitCanvas.NW, ny=(clientY-r.top)/r.height*item.hitCanvas.NH;
  const R=Math.round(item.hitCanvas.NW*0.03); // forgiving finger-sized radius
  try{
    const sx=Math.max(0,nx-R), sy=Math.max(0,ny-R), s=R*2;
    const d=item.hitCanvas.x.getImageData(sx,sy,s,s).data;
    for(let i=3;i<d.length;i+=16) if(d[i]>20) return true;
  }catch(e){ return true; }
  return false;
}

/* sizing */
function fit(){
  const nw=+stage.dataset.nw, nh=+stage.dataset.nh; if(!nw) return;
  const s=Math.min(innerWidth/nw, innerHeight/nh);
  stage.style.width=(nw*s)+'px'; stage.style.height=(nh*s)+'px';
}
addEventListener('resize',fit);

/* ---------- tilt input ---------- */
let tiltX=0, tiltY=0;             // smoothed, in degrees, relative to neutral
let rawX=0, rawY=0, base=null, haveSensor=false;
function onOrient(e){
  if(e.gamma==null||e.beta==null) return;
  haveSensor=true;
  if(!base) base={g:e.gamma,b:e.beta};
  rawX=e.gamma-base.g; rawY=e.beta-base.b;
}
function startOrient(){ addEventListener('deviceorientation',onOrient); $('#calBtn').hidden=false; }
const tiltBtn=$('#tiltBtn');
if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
  tiltBtn.hidden=false;
  tiltBtn.onclick=async()=>{ try{ const r=await DeviceOrientationEvent.requestPermission(); if(r==='granted'){ startOrient(); tiltBtn.hidden=true; } }catch(e){} };
} else if('DeviceOrientationEvent' in window){ startOrient(); }
$('#calBtn').onclick=()=>{ base=null; };

// desktop fallback: pointer distance from centre acts as a "tilt"
addEventListener('pointermove',(e)=>{
  if(haveSensor) return;
  rawX=(e.clientX/innerWidth-0.5)*2*30; rawY=(e.clientY/innerHeight-0.5)*2*30;
});

/* ---------- tap bee A ---------- */
addEventListener('pointerdown',(e)=>{
  const a=beeItems.find(b=>b.tappable); if(!a) return;
  if(e.target.closest('#ui')) return;
  if(hitsBee(a,e.clientX,e.clientY)){ a.react=1; a.reactStart=performance.now()/1000; }
});

/* ---------- main loop ---------- */
let eyeState=0;
function setEye(n){ if(n===eyeState||!eyeImgs.length) return; eyeState=n; eyeImgs.forEach((im,i)=>im.classList.toggle('off',i!==Math.min(n,eyeImgs.length-1))); }

function tick(ms){
  const t=ms/1000;
  const W=stage.clientWidth;

  // smooth tilt
  tiltX+=(rawX-tiltX)*0.12; tiltY+=(rawY-tiltY)*0.12;
  const mag=Math.hypot(tiltX,tiltY);

  // eyes: close on tilt, open at neutral (with hysteresis so they don't flicker)
  const h=1.5;
  let want=eyeState;
  if(mag>CFG.closedAt) want=2;
  else if(mag>CFG.halfAt) want=(eyeState===2 && mag>CFG.closedAt-h)?2:1;
  else if(mag<CFG.halfAt-h) want=0;
  else want=(eyeState===0)?0:1;
  setEye(want);

  // parallax shift (tilt right => scene shifts opposite, nearer layers move more)
  const px=Math.max(-1,Math.min(1,tiltX/30)), py=Math.max(-1,Math.min(1,tiltY/30));
  for(const L of layers){
    const sx=-px*CFG.parallaxMaxPct/100*W*L.parallax;
    const sy=-py*CFG.parallaxMaxPct/100*W*L.parallax*0.6;
    L.el.style.transform=`translate3d(${sx.toFixed(2)}px,${sy.toFixed(2)}px,0)`;
  }

  // flowers: breeze = shared slow gust envelope * per-flower oscillation (+ a little skew for bend)
  const gust=0.65+0.35*Math.sin(2*Math.PI*CFG.gustSpeed*t)+0.12*Math.sin(2*Math.PI*CFG.gustSpeed*2.7*t+1.3);
  for(const f of flowerItems){
    const w=Math.sin(2*Math.PI*f.speed*t+f.phase)+0.3*Math.sin(2*Math.PI*f.speed*2.3*t+f.phase*1.9);
    const a=f.sway*gust*w;
    f.L.inner.style.transform=`rotate(${a.toFixed(3)}deg) skewX(${(a*0.35).toFixed(3)}deg)`;
  }

  // bees: wing flutter (ping-pong 0,1,2,1) + tap reaction on bee A
  const seq=[0,1,2,1];
  for(const b of beeItems){
    let hz=b.hz, tx=0, ty=0, rot=0, sc=1;
    if(b.react){
      const p=t-b.reactStart, D=1.4;
      if(p>=D){ b.react=0; b.L.inner.style.transform=''; b.L.inner.style.transformOrigin=''; }
      else{
        const k=1-p/D, e=k*k;
        hz=b.hz*2.2;                                           // frantic wings
        ty=-Math.sin(Math.min(p/0.35,1)*Math.PI)*W*0.018*k - Math.sin(p*18)*W*0.004*e;
        tx=Math.sin(p*22)*W*0.005*e;                           // buzz jitter
        rot=Math.sin(p*14)*7*e;
        sc=1+0.07*Math.sin(Math.min(p/0.25,1)*Math.PI)*k;
        b.L.inner.style.transformOrigin=b.center;
      }
    }
    // idle hover bob, slightly different per bee
    if(!b.react){ ty=Math.sin(t*1.3+b.hz)*W*0.002; tx=Math.cos(t*0.9+b.hz)*W*0.0015; }
    b.L.inner.style.transformOrigin = b.react ? b.center : '50% 50%';
    b.L.inner.style.transform=`translate(${tx.toFixed(2)}px,${ty.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)})`;

    const idx=seq[Math.floor(t*hz*seq.length/ (seq.length/ (seq.length))) % seq.length];
    if(idx!==b.cur && b.frames.length){
      b.frames[Math.min(b.cur,b.frames.length-1)].classList.add('off');
      b.frames[Math.min(idx,b.frames.length-1)].classList.remove('off');
      b.cur=idx;
    }
  }
  requestAnimationFrame(tick);
}

build();
</script>
</body>
</html>
