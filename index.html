<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tilt Parallax – Beeman</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #151515; overflow: hidden; }
  body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .stage {
    --ar: 1;
    position: relative;
    width: min(100vw, calc(100dvh * var(--ar)));
    aspect-ratio: var(--ar);
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .layer {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 100%;
    object-fit: fill;
    will-change: transform;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .ui {
    position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  button#enable {
    pointer-events: auto;
    font-weight: 600; font-size: 15px; line-height: 1; font-family: inherit;
    padding: 12px 20px; border-radius: 999px; border: 0;
    background: #f2f2f2; color: #151515; cursor: pointer;
  }
  button#enable:focus-visible { outline: 3px solid #7fb4ff; outline-offset: 3px; }
  .hint {
    font-size: 13px; color: #fff; background: rgba(0,0,0,.55);
    padding: 6px 12px; border-radius: 999px;
    transition: opacity .6s ease;
  }
  .hidden { display: none !important; }
  .fade { opacity: 0; }
</style>
</head>
<body>

<main class="stage" id="stage" aria-label="Animated bee illustration with swaying flowers and fluttering bees. It shifts as you tilt your phone or move your mouse; the eyes close when tilted. Tap to make the front bee buzz.">
  <div class="ui">
    <button id="enable" class="hidden" type="button">Tap to enable tilt</button>
    <div id="hint" class="hint hidden"></div>
  </div>
</main>

<script>
/* ======================= EDIT THESE ======================= */

/*
  LAYERS: list from BACK to FRONT (the order of lines = stacking order).

  id          a short name the animation script uses
  depth       0 = barely moves, 1+ = moves the most (tilt parallax)
  controlled  true = the script fades this layer in and out (flower poses, wing frames, eyelids)
  start       true = this controlled layer is visible before the script runs / with reduced motion
  origin      pivot point as "x% y%" of the whole canvas

  Groups of numbered files (flower01-04, beeA01-03...) are built with set() below.
  Frames in a group share the same depth/origin so they always move together.
*/
const pad2 = n => String(n).padStart(2, "0");
function set(id, prefix, count, props) {
  return Array.from({ length: count }, (_, i) => ({
    id: id + (i + 1), group: id, frame: i,
    src: prefix + pad2(i + 1) + ".png",
    controlled: true, start: i === 0,
    ...props
  }));
}

// Depths increase with the stacking order so nearer things always move more.
const FLOWERS_BACK  = { depth: 0.35, origin: "50% 100%", swayDeg: 0.5 };  // swayDeg = smooth rotate/bend amount in degrees (set 0 to rely on the poses alone)
const FLOWERS_MID   = { depth: 0.50, origin: "50% 100%", swayDeg: 0.8 };
const FLOWERS_FRONT = { depth: 0.65, origin: "50% 100%", swayDeg: 1.2 };
const EYES          = { depth: 0.75 };

// Bees. origin = the bee's centre as "x% y%" of the whole canvas (EDIT THIS for bee A so its tap-hop pivots around the bee).
// bob = size of the idle hover drift (fraction of image width).
const BEE_A = { depth: 0.85, origin: "50% 50%", bob: 0.004, bobPeriod: 2.3, bobPhase: 0.0 };
const BEE_B = { depth: 0.95, origin: "50% 50%", bob: 0.005, bobPeriod: 2.9, bobPhase: 2.1 };
const BEE_C = { depth: 1.05, origin: "50% 50%", bob: 0.006, bobPeriod: 3.4, bobPhase: 4.0 };

const LAYERS = [
  { id: "background", src: "layer1-beeman-background.png", depth: 0.15 },
  { id: "honeycomb",  src: "layer2-beeman-honeycomb.png",  depth: 0.25 },

  ...set("flBack",  "layer3-beeman-back-flower", 4, FLOWERS_BACK),
  ...set("flMid",   "layer4-beeman-mid-flower",  4, FLOWERS_MID),
  ...set("flFront", "layer5-beeman-frnt-flower", 4, FLOWERS_FRONT),

  // Eyes: eye01 = open, eye02 = half closed, eye03 = closed.
  { id: "eye1", src: "layer6-beeman-eye01.png", ...EYES, controlled: true, start: true },
  { id: "eye2", src: "layer6-beeman-eye02.png", ...EYES, controlled: true },
  { id: "eye3", src: "layer6-beeman-eye03.png", ...EYES, controlled: true },

  ...set("beeA", "layer7-beeman-beeA", 3, BEE_A),   // reacts to tap / click
  ...set("beeB", "layer8-beeman-beeB", 3, BEE_B),
  ...set("beeC", "layer9-beeman-beeC", 3, BEE_C)
];

// ---- Movement feel ----
const MAX_SHIFT = 0.03;      // front-layer travel as a fraction of image width
const TILT_RANGE = 20;       // degrees of phone tilt for full movement
const SMOOTHING = 0.08;      // 0.04 = floaty, 0.15 = snappy
const DIRECTION = 1;         // set to -1 if the movement feels backwards

// ---- Flowers in the breeze ----
// "poses"    = the 4 files per flower layer are sway poses of one flower group. Only ONE pose shows at a time
//              (01-02-03-04-03-02...), and a smooth rotate/bend (swayDeg above) runs on top so it never looks steppy.
// "separate" = each file is its own flower, all visible at once; every one rotates gently on its own timing
const FLOWER_MODE = "poses";
const FLOWER_AMOUNT = 1.0;   // poses mode: 1 = use the full 01..04 range, 0.5 = only the middle half
const POSE_HYST = 0.15;      // poses mode: higher = poses hold longer before swapping (less flicker)
const FLOWER_GROUPS = [      // period = seconds per sway, phase = offset so the depths aren't in lockstep
  { id: "flBack",  n: 4, period: 6.0, phase: 0.0 },
  { id: "flMid",   n: 4, period: 5.2, phase: 1.1 },
  { id: "flFront", n: 4, period: 4.4, phase: 2.3 }
];
const GUST_PERIOD = 15;      // seconds per slow "breeze" swell that makes the sway stronger and weaker

// ---- Eyes: close on tilt, open at neutral. Amounts are 0..1 of TILT_RANGE ----
const EYE_HALF_AT = 0.30;    // tilt amount where the eyes go half closed
const EYE_CLOSED_AT = 0.65;  // tilt amount where the eyes are fully closed
const EYE_HYST = 0.05;       // stops flicker right at a threshold
const EYE_OPEN_IS_BASE = true; // true = eye01 always stays visible under the half/closed frames
                               // false = eye01 is hidden whenever eye02/eye03 show (use if those are full replacements)

// ---- Bees: wing frames ping-pong 1-2-3-2. hz = full wing cycles per second ----
const BEES = [
  { id: "beeA", n: 3, hz: 7,  start: 0 },
  { id: "beeB", n: 3, hz: 5,  start: 1 },
  { id: "beeC", n: 3, hz: 9,  start: 2 }
];
const FLAP_SEQ = [0, 1, 2, 1];

// ---- Tap / click on bee A ----
const REACT_TIME = 1.4;      // seconds the reaction lasts
const REACT_FLAP = 1.8;      // wing speed multiplier while it reacts
const REACT_HOP = 0.022;     // hop height (fraction of image width)
const REACT_BUZZ = 0.005;    // side-to-side buzz size
const REACT_TILT = 7;        // wobble in degrees

/* ======================= CODE ======================= */

const stage = document.getElementById("stage");
const enableBtn = document.getElementById("enable");
const hint = document.getElementById("hint");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const TAU = Math.PI * 2;

// Build the layers
const layers = LAYERS.map((cfg, i) => {
  const img = new Image();
  img.className = "layer";
  img.alt = "";
  img.draggable = false;
  img.src = cfg.src;
  img.style.transformOrigin = cfg.origin || "50% 50%";
  if (cfg.controlled) img.style.opacity = cfg.start ? 1 : 0;
  stage.insertBefore(img, stage.querySelector(".ui"));
  return {
    id: cfg.id,
    group: cfg.group || null,
    el: img,
    depth: cfg.depth,
    swayDeg: cfg.swayDeg || 0,
    bob: cfg.bob || 0,
    bobPeriod: cfg.bobPeriod || 3,
    bobPhase: cfg.bobPhase || 0,
    controlled: !!cfg.controlled,
    phase: i * 1.7,
    shift: 0,
    lastOp: -1
  };
});

// Match stage to the first layer's aspect ratio
function setAspect() {
  const first = layers[0].el;
  if (first.naturalWidth) stage.style.setProperty("--ar", first.naturalWidth / first.naturalHeight);
  sizeLayers();
}
layers[0].el.addEventListener("load", setAspect);
if (layers[0].el.complete) setAspect();

// Each layer is enlarged by the distance it can travel, so edges never show.
function sizeLayers() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  layers.forEach(l => {
    l.shift = l.depth * MAX_SHIFT * w;
    const pad = l.shift;
    l.el.style.left = -pad + "px";
    l.el.style.top = -pad + "px";
    l.el.style.width = (w + pad * 2) + "px";
    l.el.style.height = (h + pad * 2) + "px";
  });
}
new ResizeObserver(sizeLayers).observe(stage);

/* ---------- Scene (flowers, eyes, bees) ---------- */

let op = {};            // opacity for each controlled layer this frame, by id
let lastT = null;
let eyeState = 0;       // 0 open, 1 half, 2 closed
let reactStart = -99;   // time bee A was last tapped
const beeAcc = {};      // wing-flap progress per bee
BEES.forEach(b => beeAcc[b.id] = b.start);

function gustAmount(t) {
  const g = Math.sin(TAU * t / GUST_PERIOD) + 0.35 * Math.sin(TAU * t / (GUST_PERIOD * 0.37) + 1.3);
  return clamp(0.7 + 0.3 * (g / 1.35), 0.35, 1);
}
let gust = 1;

// Flowers. Each depth has one sway wave (w, -1..1). In "poses" mode that wave
// (a) picks ONE pose to show (hard swap, never two at once, so no ghosting) and
// (b) drives a continuous rotate/bend on whatever pose is showing, which keeps the motion smooth between swaps.
const flowerW = {};      // current sway wave per group id
const flowerPose = {};   // pose currently showing per group id
function runFlowers(t) {
  gust = gustAmount(t);
  for (const g of FLOWER_GROUPS) {
    flowerW[g.id] = (Math.sin(TAU * t / g.period + g.phase) + 0.25 * Math.sin(TAU * t * 2.3 / g.period + g.phase * 2)) / 1.25;
  }
  if (FLOWER_MODE === "separate") {
    for (const g of FLOWER_GROUPS) for (let i = 1; i <= g.n; i++) op[g.id + i] = 1;
    return;
  }
  for (const g of FLOWER_GROUPS) {
    const last = g.n - 1;
    const p = clamp(last / 2 + (last / 2) * FLOWER_AMOUNT * gust * flowerW[g.id], 0, last);
    let cur = flowerPose[g.id];
    // hysteresis: only change pose once p is clearly closer to another one (prevents flicker at a boundary)
    if (cur == null || Math.abs(p - cur) > 0.5 + POSE_HYST) cur = clamp(Math.round(p), 0, last);
    flowerPose[g.id] = cur;
    op[g.id + (cur + 1)] = 1;
  }
}

function runEyes(mag) {
  let s = eyeState;
  if (s < 2 && mag > EYE_CLOSED_AT) s = 2;
  else if (s === 2 && mag < EYE_CLOSED_AT - EYE_HYST) s = 1;
  if (s === 0 && mag > EYE_HALF_AT) s = 1;
  else if (s === 1 && mag < EYE_HALF_AT - EYE_HYST) s = 0;
  eyeState = s;
  op.eye1 = (EYE_OPEN_IS_BASE || s === 0) ? 1 : 0;
  op.eye2 = s === 1 ? 1 : 0;
  op.eye3 = s === 2 ? 1 : 0;
}

function runBees(t, dt) {
  const reacting = (t - reactStart) < REACT_TIME;
  for (const b of BEES) {
    const speed = (b.id === "beeA" && reacting) ? REACT_FLAP : 1;
    beeAcc[b.id] += dt * b.hz * speed * FLAP_SEQ.length;
    const idx = FLAP_SEQ[Math.floor(beeAcc[b.id]) % FLAP_SEQ.length];
    op[b.id + (Math.min(idx, b.n - 1) + 1)] = 1;
  }
}

// Extra transform for bee A while it reacts to a tap
function reaction(t, W) {
  const p = t - reactStart;
  if (p < 0 || p >= REACT_TIME) return null;
  const k = 1 - p / REACT_TIME, e = k * k;
  return {
    dx: Math.sin(p * 22) * REACT_BUZZ * W * e,
    dy: -Math.sin(Math.min(p / 0.35, 1) * Math.PI) * REACT_HOP * W * k - Math.sin(p * 18) * REACT_BUZZ * 0.8 * W * e,
    rot: Math.sin(p * 14) * REACT_TILT * e,
    sc: 1 + 0.07 * Math.sin(Math.min(p / 0.25, 1) * Math.PI) * k
  };
}

/* ---------- Movement state ---------- */

let tx = 0, ty = 0, cx = 0, cy = 0;

function frame(now) {
  const t = now / 1000;
  const dt = lastT == null ? 0 : Math.min(t - lastT, 0.1);
  lastT = t;
  const W = stage.clientWidth;

  cx += (tx - cx) * SMOOTHING;
  cy += (ty - cy) * SMOOTHING;

  op = {};
  runFlowers(t);
  runEyes(Math.hypot(cx, cy));
  runBees(t, dt);
  const react = reaction(t, W);

  for (const l of layers) {
    let dx = -cx * l.shift * DIRECTION;
    let dy = -cy * l.shift * DIRECTION;
    let rot = 0, skew = 0, sx = 1, sy = 1;

    // flower sway: smooth rotate + bend
    if (l.swayDeg) {
      const g = FLOWER_GROUPS.find(g => g.id === l.group);
      let w;
      if (FLOWER_MODE === "separate") {            // every file moves on its own timing
        const period = g ? g.period : 5;
        w = Math.sin(TAU * t / period + l.phase) + 0.3 * Math.sin(TAU * t * 2.3 / period + l.phase * 1.9);
      } else {                                     // all poses of a depth share one wave, so swaps are seamless
        w = g ? flowerW[g.id] : 0;
      }
      rot = l.swayDeg * gust * w;
      skew = rot * 0.35;
    }

    // idle hover drift for bees
    if (l.bob) {
      dx += Math.sin(TAU * t / l.bobPeriod + l.bobPhase) * l.bob * W * 0.6;
      dy += Math.cos(TAU * t / (l.bobPeriod * 1.3) + l.bobPhase) * l.bob * W;
    }

    // tap reaction (bee A only)
    if (react && l.group === "beeA") {
      dx += react.dx; dy += react.dy; rot += react.rot; sx = sy = react.sc;
    }

    l.el.style.transform =
      "translate3d(" + dx + "px," + dy + "px,0) rotate(" + rot + "deg) skewX(" + skew + "deg) scale(" + sx + "," + sy + ")";

    if (l.controlled) {
      const v = op[l.id] || 0;
      if (v !== l.lastOp) { l.el.style.opacity = v; l.lastOp = v; }
    }
  }
  requestAnimationFrame(frame);
}
if (!reduceMotion) requestAnimationFrame(frame);

/* ---------- Input: mouse, tilt, taps ---------- */

stage.addEventListener("pointermove", e => {
  if (e.pointerType === "touch" || reduceMotion) return;
  const r = stage.getBoundingClientRect();
  tx = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1);
  ty = clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1, 1);
});
stage.addEventListener("pointerleave", e => {
  if (e.pointerType !== "touch") { tx = 0; ty = 0; }
});

let base = null;
let gotSensor = false;

function onOrientation(e) {
  if (e.gamma == null || e.beta == null || reduceMotion) return;
  gotSensor = true;
  if (!base) base = { g: e.gamma, b: e.beta };
  tx = clamp((e.gamma - base.g) / TILT_RANGE, -1, 1);
  ty = clamp((e.beta - base.b) / TILT_RANGE, -1, 1);
}

function showHint(text, ms) {
  hint.textContent = text;
  hint.classList.remove("hidden", "fade");
  clearTimeout(showHint.t);
  showHint.t = setTimeout(() => {
    hint.classList.add("fade");
    setTimeout(() => hint.classList.add("hidden"), 700);
  }, ms);
}

function startTilt() {
  window.addEventListener("deviceorientation", onOrientation);
  enableBtn.classList.add("hidden");
  showHint("Tilt your phone to close the eyes. Tap for a buzz. Double-tap to re-center.", 5000);
  setTimeout(() => {
    if (!gotSensor) showHint("No motion sensor found. Move your mouse over the image.", 4000);
  }, 1500);
}

// Tap = bee A buzzes. Double-tap = re-center the tilt.
let lastTap = 0;
stage.addEventListener("pointerdown", () => {
  const now = performance.now();
  if (now - lastTap < 350) {
    base = null;
    lastTap = 0;
    showHint("Re-centered.", 1200);
    return;
  }
  lastTap = now;
  if (!reduceMotion) reactStart = now / 1000;
});

const needsPermission =
  typeof DeviceOrientationEvent !== "undefined" &&
  typeof DeviceOrientationEvent.requestPermission === "function";

const isTouch = matchMedia("(pointer: coarse)").matches;

if (needsPermission) {
  enableBtn.classList.remove("hidden");
  enableBtn.addEventListener("click", async () => {
    try {
      const result = await DeviceOrientationEvent.requestPermission();
      if (result === "granted") {
        startTilt();
      } else {
        enableBtn.classList.add("hidden");
        showHint("Motion access was denied. Reload the page to try again.", 5000);
      }
    } catch (err) {
      showHint("Couldn't enable tilt on this page.", 4000);
    }
  });
} else if (isTouch && "DeviceOrientationEvent" in window) {
  startTilt();
} else {
  showHint("Move your mouse toward the edges to close the eyes. Click for a buzz.", 4000);
}
</script>
</body>
</html>
